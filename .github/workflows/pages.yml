name: Publish JADE STUDIO
on:
  push:
    branches: [main]
    paths: ['jade-site-v9.tar.gz.part-*', 'overrides/**', .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Restore and verify the exact Sites v9 release
        run: |
          cat jade-site-v9.tar.gz.part-* > "$RUNNER_TEMP/jade-site.tar.gz"
          echo "14f95aa254aa9b62a8c0601abca45fbf0edf6927413dfa57f4ca5c3ff8a8db09  $RUNNER_TEMP/jade-site.tar.gz" | sha256sum --check
          mkdir public
          tar -xzf "$RUNNER_TEMP/jade-site.tar.gz" -C public --strip-components=1
          cp -R overrides/. public/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete JADE STUDIO site
        id: deployment
        uses: actions/deploy-pages@v4
